ntitas dan legalitas usaha','Dokumen sesuai ketentuan'],terms:['Mata uang','Saldo minimum','Biaya administrasi']},{n:'KPR BRI',c:1,g:'Individu',d:'Pembiayaan untuk kebutuhan rumah Anda.',who:'RM Consumer',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen penghasilan','Dokumen properti'],terms:['Tenor','Uang muka','Bunga & biaya']},{n:'BRIguna',c:1,g:'Individu',d:'Pembiayaan untuk kebutuhan pegawai.',who:'RM Consumer',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen penghasilan','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'KUR',c:1,g:'Usaha',d:'Pembiayaan untuk kebutuhan usaha mikro dan kecil.',who:'Petugas Mikro / Mantri',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen usaha','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & skema angsuran']},{n:'Kupedes',c:1,g:'Usaha',d:'Pembiayaan usaha untuk kebutuhan produktif.',who:'Petugas Mikro / Mantri',a:'Konsultasi Pengajuan',docs:['Identitas pemohon','Dokumen usaha','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'KMK (Kredit Modal Kerja)',c:1,g:'Usaha',d:'Pembiayaan modal kerja untuk mendukung usaha.',who:'RM Small/SME',a:'Konsultasi Pengajuan',docs:['Identitas dan legalitas usaha','Dokumen keuangan usaha','Dokumen pendukung'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'Kredit Investasi',c:1,g:'Usaha',d:'Pembiayaan investasi untuk pengembangan usaha.',who:'RM Small/SME',a:'Konsultasi Pengajuan',docs:['Identitas dan legalitas usaha','Dokumen rencana investasi','Dokumen keuangan'],terms:['Plafon','Tenor','Bunga & biaya']},{n:'Bank Garansi',c:2,g:null,d:'Informasi jaminan bank untuk kebutuhan bisnis.',who:'Petugas Trade',a:'Konsultasi Layanan',docs:['Identitas dan legalitas usaha','Dokumen transaksi/proyek','Dokumen pendukung'],terms:['Jenis jaminan','Biaya','Masa berlaku']},{n:'Remittance International',c:2,g:null,d:'Informasi pengiriman dan penerimaan dana internasional.',who:'Petugas Layanan Internasional',a:'Konsultasi Layanan',docs:['Identitas sesuai ketentuan','Informasi transaksi','Dokumen pendukung'],terms:['Mata uang','Biaya','Waktu pemrosesan']},{n:'Kurs Beli',c:2,g:null,d:'Informasi kurs beli valuta asing.',who:'Petugas Trade',a:'Konsultasi Layanan',docs:['Identitas sesuai ketentuan','Dokumen transaksi'],terms:['Mata uang','Waktu pembaruan','Ketentuan transaksi']},{n:'Kurs Jual',c:2,g:null,d:'Informasi kurs jual valuta asing.',who:'Petugas Trade',a:'Konsultasi Layanan',docs:['Identitas sesuai ketentuan','Dokumen transaksi'],terms:['Mata uang','Waktu pembaruan','Ketentuan transaksi']},{n:'Proteksi BRI Life',c:3,g:null,d:'Temukan informasi perlindungan sesuai kebutuhan Anda.',who:'Petugas Bancassurance',a:'Konsultasi Proteksi',docs:['Identitas calon pemegang polis','Dokumen sesuai produk asuransi'],terms:['Manfaat & premi','Risiko & pengecualian','Ketentuan polis']}];;const ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const back=(page='home')=>`<button class="back" data-page="${page}">${ic('arrow-left')} Kembali</button>`;const tile=(c,i)=>`<button class="tile" data-cat="${i}"><span class="icon">${ic(c[2])}</span>${c[0]}<small>${c[1]}</small></button>`;const card=(p)=>`<button class="product" data-product="${products.indexOf(p)}"><span class="label">${cats[p.c][0]}</span><strong>${p.n}</strong><small>${p.d}</small><span class="link">Lihat detail </span></button>`;function draw(html,nav='home'){screen.innerHTML=html;root.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav));if(typeof lucide!=='undefined')lucide.createIcons();}function home(){draw(`<section class="mlati-hero"><div class="mlati-hero-copy"><span class="mlati-kicker">BRI BO YOGYAKARTA MLATI</span><h1>MLATI</h1><p class="mlati-tagline">Media Layanan dan Akses<br class="desktop-break"> Terpadu Informasi</p><p class="mlati-description">Akses informasi produk dan layanan perbankan BRI BO Yogyakarta Mlati melalui satu kanal layanan.</p><button class="mlati-hero-button" data-page="explore">Lihat Produk dan Layanan <span aria-hidden="true">↑</span></button></div><div class="mlati-visual"><img class="bri-card" src="../mlati-hero-card.jpeg" alt="Ilustrasi kantor BRI BO Yogyakarta Mlati dengan identitas MLATI"></div></section><div class="services-intro"><span class="overline">BRI BO YOGYAKARTA MLATI</span><h2>Informasi Produk dan Layanan</h2><p>Pilih kategori untuk melihat ringkasan produk, persyaratan, dan layanan yang tersedia.</p></div><div class="grid">${cats.map(tile).join('')}</div>`)}function groupCard(name,i){const count=products.filter(p=>p.c===i&&p.g===name).length;return `<button class="product group-card" data-group="${i}|${name}"><span class="label">${count} layanan</span><strong>${name}</strong><small>Lihat pilihan ${name.toLowerCase()} dalam kategori ini.</small><span class="link">Buka kelompok </span></button>`}function list(i){currentCategory=i;currentGroup=null;if(i===5)return help();const groups=[...new Set(products.filter(p=>p.c===i&&p.g).map(p=>p.g))];if(groups.length)return draw(`${back()}<span class="label">Kategori layanan</span><h2 style="margin-top:14px">${cats[i][0]}</h2><p>${cats[i][1]}. Pilih kelompok layanan untuk melihat produknya.</p><div class="list">${groups.map(g=>groupCard(g,i)).join('')}</div>`,'explore');const items=products.filter(p=>p.c===i);draw(`${back()}<h2>${cats[i][0]}</h2><p>${cats[i][1]}.</p><div class="list">${items.map(card).join('')}</div>`,'explore')}function groupList(i,g){currentCategory=i;currentGroup=g;const items=products.filter(p=>p.c===i&&p.g===g);draw(`${back('category')}<span class="label">${cats[i][0]}</span><h2 style="margin-top:14px">${g}</h2><p>Pilih layanan untuk melihat informasi produk dan persyaratannya.</p><div class="list">${items.map(card).join('')}</div>`,'explore')}function detail(i){selected=products[i];currentCategory=selected.c;currentGroup=selected.g;const p=selected;draw(`${back(p.g?'group':'category')}<span class="label">${cats[p.c][0]}</span><h2 style="margin-top:14px">${p.n}</h2><p>${p.d}</p><div class="box"><h3>Ringkasan ketentuan</h3>${p.terms.map(t=>`<div class="row"><span>${t}</span><strong>Menunggu validasi</strong></div>`).join('')}<div class="note">Nilai bunga, biaya, dan ketentuan akan diisi dari sumber resmi yang disetujui.</div></div><details open><summary>Dokumen yang perlu disiapkan</summary>${p.docs.map(d=>`<label class="check"><input type="checkbox">${d}</label>`).join('')}</details><details><summary>Bagaimana alurnya</summary><p>Pelajari informasi  siapkan dokumen  lanjutkan melalui kanal resmi atau konsultasi dengan ${p.who}.</p></details><details><summary>Pertanyaan umum</summary><p>Apakah layanan tersedia di cabang saya<br>Petugas akan mengonfirmasi ketersediaan serta ketentuan sesuai kebutuhan Anda.</p></details><button class="action" data-page="${['Buka Rekening','Daftar QRIS'].includes(p.a)?'channel':'contact'}">${p.a} </button><a class="action secondary" href="https://wa.me/?text=${encodeURIComponent('Halo, saya ingin bertanya tentang '+p.n+'.')}" target="_blank" rel="noopener noreferrer">${ic('message-circle')} Tanya Petugas</a><div class="note">Sumber dan tanggal pembaruan: diisi setelah validasi konten.<br>Contoh tampilan  bukan penawaran atau persetujuan produk.</div>`,'explore')}function help(){draw(`${back()}<h2>Bantuan & konsultasi</h2><p>Pilih layanan untuk melihat informasi atau menghubungi petugas yang sesuai.</p><div class="list">${cats.slice(0,5).map((c,i)=>`<button class="product" data-help="${i}">${ic(c[2])}<strong>${c[0]}</strong><small>Konsultasi dengan petugas terkait</small></button>`).join('')}<button class="product" data-financial-service="open"><i data-lucide="banknote"></i><strong>Transaksi Finansial</strong><small>Bantuan tarik tunai, setor tunai, RTGS, overbooking, kliring, dan inkaso</small><span class="link">Lihat bantuan</span></button><button class="product" data-auction-info><i data-lucide="landmark"></i><strong>Info Lelang BRI MLATI</strong><small>Bantuan informasi properti dan proses lelang</small><span class="link">Lihat bantuan</span></button></div><details><summary>Apakah saya perlu login?</summary><p>Informasi produk dapat diakses tanpa login. Pembukaan dan pengajuan dilanjutkan melalui kanal resmi.</p></details>`,'help')}function contact(){const p=selected||products[0];draw(`${back('detail')}<h2>Konsultasi ${p.n}</h2><p>Dapatkan penjelasan dari petugas sesuai layanan.</p><div class="box"><span class="label">Petugas terkait</span><h3 style="margin-top:16px">${p.who}</h3><p>BRI BO Yogyakarta Mlati</p><div class="row"><span>Kontak kedinasan</span><strong>Belum diisi</strong></div><div class="row"><span>Jam layanan</span><strong>Menunggu konfirmasi</strong></div></div><button class="action whatsapp-action" data-page="whatsapp"><span class="wa-mark"><svg class="wa-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.6-4.3A8 8 0 1 1 20 11.5Z"/><path d="M8.5 8.2c.3 2.3 2.2 4.4 4.6 5.2l1.4-1.1 1.3.7c.3.2.4.6.2.9l-.7 1c-.4.6-1.1.8-1.8.6-3.7-1-6.2-3.8-6.4-6.1-.1-.7.3-1.4 1-1.6l1.1-.3.6.7-.3 1.1Z"/></svg></span> Hubungi via WhatsApp</button><p class="note">Tombol ini hanya pratinjau. Prototipe tidak membuka WhatsApp atau mengirim pesan.</p>`,'help')}function whatsapp(){const p=selected||products[0];draw(`${back('contact')}<div class="whatsapp-preview"><div class="wa-preview-icon"><svg class="wa-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.6-4.3A8 8 0 1 1 20 11.5Z"/><path d="M8.5 8.2c.3 2.3 2.2 4.4 4.6 5.2l1.4-1.1 1.3.7c.3.2.4.6.2.9l-.7 1c-.4.6-1.1.8-1.8.6-3.7-1-6.2-3.8-6.4-6.1-.1-.7.3-1.4 1-1.6l1.1-.3.6.7-.3 1.1Z"/></svg></div><span class="label wa-label">PRATINJAU KONTAK</span><h2>Hubungi lewat WhatsApp</h2><p>Anda akan diarahkan ke percakapan WhatsApp resmi untuk layanan <strong>${p.n}</strong>.</p><div class="box wa-box"><div class="wa-row"><span class="wa-avatar">BRI</span><div><strong>BRI BO Yogyakarta Mlati</strong><small>Nomor resmi diisi saat implementasi</small></div></div><div class="wa-message">Halo, saya ingin mendapatkan informasi tentang ${p.n}.</div></div><button class="action whatsapp-action" data-page="home"><span class="wa-mark"></span> Kembali ke layanan</button><p class="note">Simulasi prototipe: tidak ada tautan eksternal, pesan, atau data yang dikirim.</p></div>`,'help')}function request(){draw(`${back('contact')}<h2>Minta dihubungi</h2><p>Kebutuhan: ${selected.n}</p><form id="bri-request"><label class="field">Nama contoh<input required placeholder="Contoh: Nasabah Demo" autocomplete="off"></label><label class="field">Nomor kontak contoh<input required placeholder="Gunakan nomor fiktif" inputmode="tel" autocomplete="off"></label><label class="field">Pertanyaan<textarea rows="3" placeholder="Saya ingin mengetahui persyaratannya"></textarea></label><label class="check"><input type="checkbox" required>Saya bersedia dihubungi terkait kebutuhan ini.</label><button class="action">Kirim Permintaan</button></form><div class="note">Simulasi saja. Data tidak disimpan atau dikirim. Gunakan identitas fiktif.</div>`,'help')}function finder(){const needs=[['Menabung sehari-hari',0],['Menempatkan dana berjangka',2],['Mendapatkan modal usaha',3],['Membeli rumah',5],['Menerima pembayaran pelanggan',6],['Melindungi diri dan keluarga',10],['Mendukung transaksi perdagangan',8]];draw(`${back()}<span class="label">Bantu Saya Memilih</span><h2 style="margin-top:14px">Apa kebutuhan Anda</h2><p>Pilih kebutuhan untuk melihat contoh produk terkait.</p><div class="list">${needs.map(([n,i])=>`<button class="product" data-recommend="${i}">${n} </button>`).join('')}</div>`)}function channel(){draw(`${back('detail')}<h2>Lanjut ke kanal resmi</h2><p>${selected.a==='Buka Rekening'?'Pembukaan rekening dilanjutkan melalui kanal resmi BRI, seperti BRImo.':'Pendaftaran merchant dilanjutkan melalui kanal resmi BRI.'}</p><div class="box"><h3>${selected.n}</h3><p>Identitas dan dokumen pengajuan diisi di kanal resmi sesuai ketentuannya.</p><span class="label">Simulasi pengalihan</span></div><button class="action" data-page="contact">Konsultasi Terlebih Dahulu</button><div class="note">Prototipe ini tidak membuka kanal eksternal. Tautan resmi ditetapkan saat implementasi.</div>`,'explore')}const pages={home,help,contact,whatsapp,request,finder,channel,detail:()=>detail(products.indexOf(selected||products[0])),category:()=>list(currentCategory),group:()=>currentGroup?groupList(currentCategory,currentGroup):list(currentCategory),explore:()=>draw(`${back()}<h2>Semua layanan</h2><p>Temukan produk berdasarkan kategori.</p><div class="grid">${cats.map(tile).join('')}</div>`,'explore')};root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)pages[b.dataset.nav]();else if(b.dataset.page)pages[b.dataset.page]();else if(b.dataset.cat!==undefined)list(+b.dataset.cat);else if(b.dataset.product!==undefined)detail(+b.dataset.product);else if(b.dataset.group){const [i,g]=b.dataset.group.split('|');groupList(+i,g)}else if(b.dataset.help!==undefined){selected=products.find(p=>p.c===+b.dataset.help);contact()}else if(b.dataset.recommend!==undefined){const p=products[+b.dataset.recommend];draw(`${back('finder')}<h2>Pilihan untuk kebutuhan Anda</h2><p>${p.d}</p>${card(p)}<div class="note">Pilihan berdasarkan kategori kebutuhan. Kesesuaian akhir dikonfirmasi bersama petugas.</div>`)}});root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='bri-search'){const q=e.target.querySelector('input').value.trim().toLowerCase();const matches=products.filter(p=>(p.n+' '+p.d+' '+cats[p.c][0]).toLowerCase().includes(q));draw(`${back()}<h2>Hasil pencarian</h2><p>${matches.length} produk/layanan ditemukan.</p><div class="list">${matches.map(card).join('')||'<div class="box">Belum ada hasil. Coba cari KUR, tabungan, atau QRIS.</div>'}</div>`,'explore')}else if(e.target.id==='bri-request')draw(`<div class="success"><span class="icon">${ic('check')}</span><h2>Simulasi berhasil</h2><p>Permintaan konsultasi untuk ${selected.n} selesai dicoba.</p><p>Dalam sistem final, permintaan diteruskan kepada petugas dan status tindak lanjut dapat ditampilkan.</p><button class="action" data-page="home">Kembali ke Beranda</button><div class="note">Tidak ada data yang disimpan atau dikirim.</div></div>`,'help')});home();})();
</script>

 wallet:'<path d="M4 7V5a2 2 0 0 1 2-2h12M4 7h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Zm16 5h-5v5h5"/><circle cx="17" cy="14.5" r=".5"/>',

 'shield-check':'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/>',

 };
 window.lucide.createIcons=()=>root.querySelectorAll('[data-lucide]').forEach(el=>{
 const key=el.getAttribute('data-lucide');
 if(el.querySelector('svg'))return;
 el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[key]||paths.check)+'</svg>';
 });
 function sync(){
  main.classList.toggle('home-layout',!!main.querySelector('.hero'));
  main.classList.toggle('form-layout',!!main.querySelector('#mlati-account,#mlati-complaint,#bri-request,.steps'));
  main.classList.toggle('detail-layout',!main.querySelector('.hero,.list,.grid')&&!main.classList.contains('form-layout'));
  window.lucide.createIcons();
  root.querySelectorAll('[data-nav]').forEach(b=>{if(b.classList.contains('active'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 }
 new MutationObserver(sync).observe(main,{childList:true});sync();
})();

<script>
(()=>{
 const root=document.getElementById('bri-info-preview'),main=root.querySelector('main');
 let auctionReturnPage='home';
 function addAuctionTile(){
  const grid=[...main.querySelectorAll('.grid')].find(item=>item.querySelector('[data-cat]'));
  if(!grid)return;
  let tile=grid.querySelector('[data-auction-info]');
  if(tile){
   if(grid.lastElementChild!==tile)grid.append(tile);
   return;
  }
  grid.insertAdjacentHTML('beforeend','<button class="tile" data-auction-info><span class="icon"><i data-lucide="landmark"></i></span>Info Lelang BRI MLATI<small>Informasi properti dan cara mengikuti lelang</small></button>');
  window.lucide.createIcons();
 }
 function showAuctionInfo(){
  main.innerHTML=`<button class="back" data-page="${auctionReturnPage}"><i data-lucide="arrow-left"></i> Kembali</button><span class="label">LAYANAN INFORMASI</span><h2 style="margin-top:14px">Info Properti Lelang BRI</h2><p>Temukan gambaran jenis properti yang dapat ditawarkan melalui lelang BRI serta hal-hal yang perlu diperiksa sebelum mengikuti lelang.</p><div class="list"><article class="product"><span class="label">PROPERTI HUNIAN</span><strong>Rumah</strong><small>Periksa alamat dan kondisi bangunan, luas tanah dan bangunan, dokumen kepemilikan, nilai limit, uang jaminan, serta jadwal lelang pada pengumuman objek.</small></article><article class="product"><span class="label">PROPERTI TANAH</span><strong>Tanah</strong><small>Periksa lokasi dan batas bidang, luas, status serta dokumen hak atas tanah, akses ke lokasi, nilai limit, uang jaminan, dan jadwal lelang.</small></article><article class="product"><span class="label">PROPERTI USAHA</span><strong>Ruko & bangunan</strong><small>Periksa peruntukan dan kondisi bangunan, lokasi, dokumen, nilai limit, uang jaminan, dan ketentuan lelang yang tercantum untuk objek tersebut.</small></article></div><div class="box"><h3>Informasi yang wajib dicek per objek</h3><div class="row"><span>Lokasi dan kondisi objek</span><strong>Baca pengumuman dan jadwalkan pemeriksaan jika tersedia</strong></div><div class="row"><span>Nilai limit dan uang jaminan</span><strong>Ikuti nominal serta tata cara resmi yang tercantum</strong></div><div class="row"><span>Jadwal dan persyaratan</span><strong>Pastikan batas waktu pendaftaran dan ketentuan peserta</strong></div><div class="row"><span>Dokumen dan kewajiban pemenang</span><strong>Tinjau legalitas, biaya, dan ketentuan pelunasan</strong></div></div><details><summary>Bagaimana cara mencari properti lelang BRI?</summary><p>Buka portal lelang resmi, cari pengumuman dengan penjual/pemohon lelang BRI atau PT Bank Rakyat Indonesia, lalu baca seluruh dokumen dan ketentuan objek. Informasi, status, nilai limit, uang jaminan, serta jadwal dapat berubah dan harus diverifikasi pada pengumuman resmi.</p></details><a class="action whatsapp-action" href="https://wa.me/?text=Halo%2C%20saya%20ingin%20bertanya%20tentang%20informasi%20properti%20lelang%20BRI%20MLATI." target="_blank" rel="noopener noreferrer"><span class="wa-mark" aria-hidden="true"><svg class="wa-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.6-4.3A8 8 0 1 1 20 11.5Z"/><path d="M8.5 8.2c.3 2.3 2.2 4.4 4.6 5.2l1.4-1.1 1.3.7c.3.2.4.6.2.9l-.7 1c-.4.6-1.1.8-1.8.6-3.7-1-6.2-3.8-6.4-6.1-.1-.7.3-1.4 1-1.6l1.1-.3.6.7-.3 1.1Z"/></svg></span> Hubungi via WhatsApp</a><p class="note">Kartu di atas menjelaskan kategori properti, bukan daftar objek lelang aktif atau penawaran. Pastikan nomor tujuan WhatsApp resmi sebelum mengirim pesan dan gunakan hanya prosedur pembayaran yang tercantum pada dokumen lelang resmi.</p>`;
  window.lucide.createIcons();
 }
 function linkWhatsAppButtons(){
  main.querySelectorAll('button.whatsapp-action').forEach(button=>{
   if(!button.textContent.includes('Hubungi via WhatsApp'))return;
   const service=(main.querySelector('h2')?.textContent||'layanan BRI').replace(/^Konsultasi\s+/,'');
   const link=document.createElement('a');
   link.className=button.className;
   link.href='https://wa.me/?text='+encodeURIComponent('Halo, saya ingin bertanya tentang '+service+'.');
   link.target='_blank';
   link.rel='noopener noreferrer';
   link.innerHTML=button.innerHTML;
   button.replaceWith(link);
   const note=main.querySelector('p.note');
   if(note&&note.textContent.includes('Tombol ini hanya pratinjau'))note.textContent='WhatsApp akan terbuka dengan pesan awal. Pastikan nomor tujuan resmi sebelum mengirim pesan.';
  });
 }
 addAuctionTile();
 new MutationObserver(()=>{addAuctionTile();linkWhatsAppButtons();}).observe(main,{childList:true,subtree:true});
 linkWhatsAppButtons();
 const auctionPhotos=Array.from({length:13},(_,index)=>(location.pathname.includes('/publish2/')?'../assets/auction/':'assets/auction/')+'property-'+String(index+1).padStart(2,'0')+'.jpeg');
 let activeAuctionPhoto=0;
 function renderAuctionGallery(){
  const heading=[...main.querySelectorAll('h2')].find(el=>el.textContent.trim()==='Info Properti Lelang BRI');
  const photoList=main.querySelector('.list');
  if(!heading||!photoList||main.querySelector('[data-auction-gallery]'))return;
  const intro=heading.nextElementSibling;
  if(intro?.matches('p'))intro.textContent='Lihat materi foto properti lelang yang dilampirkan. Pilih foto untuk melihat detail poster.';
  const contactNote=main.querySelector('a.whatsapp-action + p.note');
  if(contactNote)contactNote.textContent='Konfirmasikan informasi dan nomor kontak melalui saluran resmi sebelum menghubungi atau melakukan transaksi.';
  const gallery=document.createElement('section');
  gallery.className='auction-gallery';
  gallery.dataset.auctionGallery='';
  gallery.setAttribute('aria-label','Galeri foto properti lelang');
  gallery.innerHTML=`<div class="auction-gallery-header"><div><span class="label">MATERI PROPERTI LELANG</span><h3>Galeri Properti Agunan Lelang</h3></div><span class="auction-gallery-count" data-auction-count>Foto 1 dari ${auctionPhotos.length}</span></div><div class="auction-gallery-stage"><button class="auction-gallery-control" type="button" data-auction-direction="-1" aria-label="Foto sebelumnya">&lsaquo;</button><figure><img data-auction-image src="${auctionPhotos[0]}" alt="Materi foto properti lelang 1"><figcaption data-auction-caption>Foto 1 dari ${auctionPhotos.length}</figcaption></figure><button class="auction-gallery-control" type="button" data-auction-direction="1" aria-label="Foto berikutnya">&rsaquo;</button></div><div class="auction-gallery-thumbnails" aria-label="Pilih foto properti">${auctionPhotos.map((src,index)=>`<button class="auction-gallery-thumbnail" type="button" data-auction-index="${index}" aria-label="Tampilkan foto ${index+1}" aria-current="${index===0?'true':'false'}"><img src="${src}" alt="" loading="lazy"></button>`).join('')}</div><p class="auction-gallery-note">Detail harga, jadwal, lokasi, legalitas, dan kontak pada materi gambar perlu diverifikasi melalui pengumuman resmi sebelum digunakan sebagai informasi lelang.</p>`;
  photoList.replaceWith(gallery);
 }
 function selectAuctionPhoto(index){
  activeAuctionPhoto=(index+auctionPhotos.length)%auctionPhotos.length;
  const gallery=main.querySelector('[data-auction-gallery]');
  if(!gallery)return;
  const image=gallery.querySelector('[data-auction-image]');
  image.src=auctionPhotos[activeAuctionPhoto];
  image.alt='Materi foto properti lelang '+(activeAuctionPhoto+1);
  gallery.querySelector('[data-auction-count]').textContent=`Foto ${activeAuctionPhoto+1} dari ${auctionPhotos.length}`;
  gallery.querySelector('[data-auction-caption]').textContent=`Foto ${activeAuctionPhoto+1} dari ${auctionPhotos.length}`;
  gallery.querySelectorAll('[data-auction-index]').forEach(button=>button.setAttribute('aria-current',String(Number(button.dataset.auctionIndex)===activeAuctionPhoto)));
 }
 new MutationObserver(renderAuctionGallery).observe(main,{childList:true});
 root.addEventListener('click',e=>{
  const thumbnail=e.target.closest('[data-auction-index]');
  const direction=e.target.closest('[data-auction-direction]');
  if(thumbnail){selectAuctionPhoto(Number(thumbnail.dataset.auctionIndex));return;}
  if(direction){selectAuctionPhoto(activeAuctionPhoto+Number(direction.dataset.auctionDirection));return;}
  if(e.target.closest('[data-auction-info]')){
   auctionReturnPage=main.querySelector('h2')?.textContent.trim()==='Bantuan & konsultasi'?'help':main.querySelector('.services-intro')?'home':'explore';
   showAuctionInfo();
  }
 });
})();
</script>
<script>
(()=>{
 const root=document.getElementById('bri-info-preview');
 const main=root.querySelector('main');
 const services=[
  {id:'tarik-tunai',name:'Tarik Tunai',description:'Penarikan dana dari rekening melalui teller atau kanal yang tersedia.',requirements:['Rekening aktif dengan saldo yang mencukupi.','Kartu, buku rekening, dan/atau identitas sesuai kanal yang digunakan.','Otorisasi transaksi sesuai prosedur keamanan.'],conditions:['Batas penarikan, biaya, dan kanal layanan mengikuti jenis rekening serta ketentuan yang berlaku.','Pastikan jumlah uang dan bukti transaksi sesuai sebelum meninggalkan loket/mesin.']},
  {id:'setor-tunai',name:'Setor Tunai',description:'Penyetoran uang tunai ke rekening melalui teller atau kanal setor tunai yang tersedia.',requirements:['Uang tunai yang akan disetorkan dan nomor rekening tujuan.','Identitas atau formulir transaksi apabila diminta sesuai kanal.','Simpan bukti setoran untuk pemeriksaan.'],conditions:['Periksa kembali nomor rekening tujuan dan jumlah setoran.','Batas nominal, ketersediaan kanal, dan prosedur dapat berbeda menurut layanan.']},
  {id:'rtgs',name:'RTGS',description:'Layanan transfer antarbank melalui mekanisme Real Time Gross Settlement.',requirements:['Nama dan nomor rekening penerima serta nama bank tujuan.','Dana pada rekening sumber untuk nominal transfer dan biaya yang berlaku.','Formulir atau otorisasi transaksi sesuai kanal yang digunakan.'],conditions:['Biaya, batas nominal, jam operasional, dan waktu penyelesaian mengikuti ketentuan BRI dan sistem yang berlaku.','Periksa data penerima dengan teliti; transaksi yang sudah diproses dapat sulit dibatalkan.']},
  {id:'overbooking',name:'Overbooking',description:'Pemindahbukuan dana antar rekening melalui layanan BRI yang tersedia.',requirements:['Informasi rekening sumber dan rekening tujuan.','Dana tersedia serta otorisasi pemilik rekening sesuai prosedur.','Identitas atau dokumen pendukung jika diminta petugas.'],conditions:['Ketersediaan, biaya, batas transaksi, dan kanal mengikuti jenis rekening serta ketentuan BRI.','Pastikan nama pemilik dan nomor rekening tujuan sudah benar sebelum menyetujui transaksi.']},
  {id:'kliring',name:'Kliring',description:'Pemindahan dana antarbank melalui mekanisme kliring yang berlaku.',requirements:['Nama dan nomor rekening penerima serta bank tujuan.','Dana yang cukup pada rekening sumber.','Formulir dan otorisasi transaksi sesuai kanal layanan.'],conditions:['Jadwal pemrosesan, biaya, batas nominal, dan waktu dana diterima mengikuti ketentuan BRI dan sistem kliring.','Waktu penyelesaian tidak selalu seketika dan dapat dipengaruhi jadwal operasional.']},
  {id:'inkaso',name:'Inkaso',description:'Layanan penagihan warkat melalui bank, misalnya cek atau bilyet giro, sesuai ketersediaan layanan.',requirements:['Warkat asli yang akan ditagihkan.','Identitas dan informasi rekening penerima hasil penagihan.','Dokumen/formulir pendukung sesuai pemeriksaan petugas.'],conditions:['Warkat akan diperiksa keabsahan dananya serta kelengkapan sesuai ketentuan.','Biaya dan waktu penagihan dapat berbeda menurut jenis warkat, bank tertarik, dan wilayah.']}
 ];
 let returnTo='home';
 const updateNav=()=>root.querySelectorAll('[data-nav]').forEach(button=>button.classList.toggle('active',button.dataset.nav==='explore'));
 const drawIcons=()=>{if(typeof lucide!=='undefined')lucide.createIcons()};
 function addServiceCard(){
  const grid=main.querySelector('.grid');
  if(!grid||grid.querySelector('[data-financial-service]'))return;
  const card=document.createElement('button');
  card.className='tile';
  card.dataset.financialService='open';
  card.innerHTML='<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6.5 9.5h.01M17.5 14.5h.01"></path></svg></span>Transaksi Finansial<small>Tarik tunai, setor tunai, dan layanan transfer</small>';
  grid.append(card);
  drawIcons();
 }
 function showList(){
  main.innerHTML=`<button class="back" data-financial-back="return">← Kembali</button><span class="label">INFORMASI LAYANAN</span><h2 style="margin-top:14px">Transaksi Finansial</h2><p>Pilih jenis layanan untuk melihat gambaran persyaratan dan hal yang perlu diperhatikan.</p><div class="list">${services.map(service=>`<button class="product" data-financial-detail="${service.id}"><strong>${service.name}</strong><small>${service.description}</small><span class="link">Lihat informasi</span></button>`).join('')}</div><div class="financial-disclaimer">Informasi ini merupakan panduan umum, bukan instruksi untuk melakukan transaksi. Syarat, biaya, limit, jam layanan, dan ketersediaan dapat berubah; konfirmasikan ke BRI sebelum bertransaksi.</div>`;
  updateNav();
  drawIcons();
 }
 function showDetail(service){
  main.innerHTML=`<button class="back" data-financial-back="list">← Kembali ke Transaksi Finansial</button><span class="label">TRANSAKSI FINANSIAL</span><h2 style="margin-top:14px">${service.name}</h2><p>${service.description}</p><div class="box"><h3>Persyaratan umum</h3><ul class="financial-info-list">${service.requirements.map(item=>`<li>${item}</li>`).join('')}</ul></div><div class="box"><h3>Syarat dan ketentuan yang perlu dikonfirmasi</h3><ul class="financial-info-list">${service.conditions.map(item=>`<li>${item}</li>`).join('')}</ul></div><div class="financial-disclaimer">Persyaratan di atas bersifat umum dan dapat berbeda berdasarkan rekening, kanal, nominal, serta ketentuan terbaru BRI. Halaman ini hanya menyajikan informasi dan tidak memproses transaksi.</div><button class="action" data-page="contact">Tanya petugas</button>`;
  updateNav();
  drawIcons();
 }
 root.addEventListener('click',event=>{
  const card=event.target.closest('[data-financial-service]');
  const detail=event.target.closest('[data-financial-detail]');
  const back=event.target.closest('[data-financial-back]');
  if(card){
   event.preventDefault();
   event.stopImmediatePropagation();
   returnTo=main.querySelector('h2')?.textContent.trim()==='Bantuan & konsultasi'?'help':main.querySelector('.services-intro')?'home':'explore';
   showList();
  }else if(detail){
   event.preventDefault();
   event.stopImmediatePropagation();
   const service=services.find(item=>item.id===detail.dataset.financialDetail);
   if(service)showDetail(service);
  }else if(back){
   event.preventDefault();
   event.stopImmediatePropagation();
   if(back.dataset.financialBack==='list')showList();
   else root.querySelector(`[data-nav="${returnTo}"]`)?.click();
  }
 },true);
 new MutationObserver(addServiceCard).observe(main,{childList:true});
 addServiceCard();
})();
</script>
</body>
</html>
